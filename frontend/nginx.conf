server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # DSpace REST API
    location /server/ {
        proxy_pass        http://dspace:8080/server/;
        proxy_set_header  Host $host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_header Set-Cookie;
    }

    # Django config API (all /api/* routes → Django)
    location /api/ {
        proxy_pass       http://django:5189/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django admin UI
    location /admin/ {
        proxy_pass       http://django:5189/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Django static files (admin CSS/JS served by WhiteNoise)
    location /static/ {
        proxy_pass       http://django:5189/static/;
        proxy_set_header Host $host;
    }
}
